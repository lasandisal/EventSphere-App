<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="bookings">

<nav class="es-navbar">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="../index.html" class="brand"><span class="sparkle" id="brandSparkle"></span>EventSphere</a>
    <button class="navbar-toggler d-lg-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"><i class="bi bi-list fs-3"></i></button>
    <div class="collapse navbar-collapse d-lg-flex justify-content-lg-center" id="navLinks">
      <ul class="navbar-nav gap-lg-2 mt-3 mt-lg-0">
        <li class="nav-item"><a class="nav-link" data-nav="home" href="../index.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="events" href="events.html">Categories</a></li>
        <li class="nav-item"><a class="nav-link active" data-nav="bookings" href="my-bookings.html">My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="organizer" href="organizer-dashboard.html">Organizer</a></li>
      </ul>
    </div>
    <div class="d-flex align-items-center gap-2"><div id="navAuthSlot" class="d-flex align-items-center gap-2"></div></div>
  </div>
</nav>

<header class="section-sm pb-0">
  <div class="container-narrow">
    <p class="eyebrow">Your experiences</p>
    <h1 style="font-size:2.4rem;">My Bookings</h1>
  </div>
</header>

<section class="section-sm">
  <div class="container-narrow">
    <ul class="nav mb-4" style="gap:0.5rem;" id="bookingTabs">
      <li><button class="btn btn-quiet active" data-tab="upcoming">Upcoming</button></li>
      <li><button class="btn btn-quiet" data-tab="past">Past</button></li>
      <li><button class="btn btn-quiet" data-tab="cancelled">Cancelled</button></li>
    </ul>

    <div id="bookingsList" class="d-flex flex-column gap-3"></div>
  </div>
</section>

<!-- Cancel confirmation modal -->
<div class="modal fade es-modal" id="cancelModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-body text-center">
        <h4 class="mb-2">Cancel this booking?</h4>
        <p class="text-muted-soft">This can't be undone. Refunds follow the event's cancellation policy.</p>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button class="btn btn-outline-soft" data-bs-dismiss="modal">Keep booking</button>
        <button class="btn btn-danger-soft" id="confirmCancelBtn">Cancel booking</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/events.js"></script>
<script src="../js/api/bookings.js"></script>
<script src="../js/api/payments.js"></script>
<script src="../js/api/organizer.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/mock-data.js"></script>
<script src="../js/utils/nav.js"></script>
<script src="../js/utils/ai-widget.js"></script>
<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;

const statusMap = { confirmed: ['status-confirmed','Confirmed'], pending: ['status-pending','Pending'], cancelled: ['status-cancelled','Cancelled'], completed: ['status-completed','Completed'] };
let toCancel = null;
let cache = null;

function bookingCard(b) {
  const [cls, label] = statusMap[b.status];
  return `
  <div class="event-card flex-row" style="flex-direction:row; align-items:stretch;">
    <div style="width:160px; min-width:160px;" class="img-wrap"><img src="${b.img}" alt="${b.event}"></div>
    <div class="body w-100" style="flex-direction:row; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
      <div>
        <span class="status-badge ${cls} mb-2 d-inline-flex">${label}</span>
        <div class="title" style="font-size:1.15rem;">${b.event}</div>
        <div class="meta"><i class="bi bi-calendar3"></i> ${b.date} · <i class="bi bi-geo-alt"></i> ${b.venue}</div>
        <div class="meta">${b.tickets} ticket(s) · LKR ${b.total.toLocaleString()}</div>
      </div>
      <div class="d-flex flex-column gap-2">
        <a href="ticket.html" class="btn btn-quiet btn-sm">View Ticket</a>
        <a href="#" class="btn btn-outline-soft btn-sm">View Details</a>
        ${b.status === 'confirmed' || b.status === 'pending' ? `<button class="btn btn-danger-soft btn-sm" onclick="askCancel(${b.id})">Cancel Booking</button>` : ''}
      </div>
    </div>
  </div>`;
}

function emptyState(tab) {
  return `<div class="state-block">
    <span class="sparkle d-inline-block">${EsIcons.sparkle}</span>
    <h3>No ${tab} bookings</h3>
    <p>When you book an event, it'll show up here.</p>
    <a href="events.html" class="btn btn-primary mt-2">Discover events</a>
  </div>`;
}

function renderTab(tab) {
  const list = document.getElementById('bookingsList');
  let filtered;
  if (tab === 'upcoming') filtered = cache.filter(b => b.status === 'confirmed' || b.status === 'pending');
  else if (tab === 'past') filtered = cache.filter(b => b.status === 'completed');
  else filtered = cache.filter(b => b.status === 'cancelled');
  list.innerHTML = filtered.length ? filtered.map(bookingCard).join('') : emptyState(tab);
}

document.getElementById('bookingTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('#bookingTabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTab(btn.getAttribute('data-tab'));
});

function askCancel(id) {
  toCancel = id;
  new bootstrap.Modal(document.getElementById('cancelModal')).show();
}
document.getElementById('confirmCancelBtn').addEventListener('click', async () => {
  try { await BookingsAPI.cancel(toCancel); } catch (e) { /* demo mode */ }
  const b = cache.find(x => x.id === toCancel);
  if (b) b.status = 'cancelled';
  bootstrap.Modal.getInstance(document.getElementById('cancelModal')).hide();
  esToast('Booking cancelled');
  renderTab(document.querySelector('#bookingTabs button.active').getAttribute('data-tab'));
});

async function loadBookings() {
  try {
    const res = await BookingsAPI.myBookings();
    cache = (res && res.content) || [];
    if (!cache.length) cache = EsMock.bookings;
  } catch (e) {
    cache = EsMock.bookings;
  }
  renderTab('upcoming');
}
loadBookings();
</script>
</body>
</html>
