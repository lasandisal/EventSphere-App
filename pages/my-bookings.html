<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — EventSphere</title>
<link rel="icon" type="image/png" href="../assets/images/logo.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="bookings">

<nav class="es-navbar">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="../index.html" class="brand text-decoration-none d-flex align-items-center"><img src="../assets/images/logo.png" alt="EventSphere Logo" class="brand-logo me-2">EventSphere</a>
    <button class="navbar-toggler d-lg-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"><i class="bi bi-list fs-3"></i></button>
    <div class="collapse navbar-collapse d-lg-flex justify-content-lg-center" id="navLinks">
      <ul class="navbar-nav gap-lg-2 mt-3 mt-lg-0">
        <li class="nav-item"><a class="nav-link" data-nav="home" href="../index.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="events" href="events.html">Categories</a></li>
        <li class="nav-item"><a class="nav-link active" data-nav="bookings" href="my-bookings.html">My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="about" href="about.html">About</a></li>
      </ul>
    </div>
    <div class="d-flex align-items-center gap-2"><div id="navAuthSlot" class="d-flex align-items-center gap-2"></div></div>
  </div>
</nav>

<header class="section-sm pb-0">
  <div class="container-narrow">
    <p class="eyebrow">Your experiences</p>
    <h1 style="font-size:2.4rem;">My Bookings</h1>
  </div>
</header>

<section class="section-sm">
  <div class="container-narrow">
    <ul class="nav mb-4" style="gap:0.5rem;" id="bookingTabs">
      <li><button class="btn btn-quiet active" data-tab="upcoming">Upcoming</button></li>
      <li><button class="btn btn-quiet" data-tab="past">Past</button></li>
      <li><button class="btn btn-quiet" data-tab="cancelled">Cancelled</button></li>
    </ul>

    <div id="bookingsList" class="d-flex flex-column gap-3"></div>
  </div>
</section>

<!-- Cancel confirmation modal -->
<div class="modal fade es-modal" id="cancelModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-body text-center">
        <h4 class="mb-2">Cancel this booking?</h4>
        <p class="text-muted-soft">This can't be undone. Refunds follow the event's cancellation policy.</p>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button class="btn btn-outline-soft" data-bs-dismiss="modal">Keep booking</button>
        <button class="btn btn-danger-soft" id="confirmCancelBtn">Cancel booking</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/events.js"></script>
<script src="../js/api/bookings.js"></script>
<script src="../js/utils/md5.js"></script>
<script src="../js/api/payments.js"></script>
<script src="../js/api/organizer.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/nav.js"></script>
<script src="../js/utils/ai-widget.js"></script>
<script>
const brandSp = document.getElementById('brandSparkle');
if (brandSp) brandSp.innerHTML = EsIcons.sparkle;

if (!EsAuthStore.isLoggedIn()) {
  window.location.href = 'login.html?redirect=' + encodeURIComponent('my-bookings.html' + window.location.search);
}

const statusMap = {
  PENDING:   ['status-pending',   'Pending payment'],
  CONFIRMED: ['status-confirmed', 'Confirmed'],
  VALID:     ['status-confirmed', 'Valid'],
  USED:      ['status-confirmed', 'Admitted'],
  CANCELLED: ['status-cancelled', 'Cancelled'],
  EXPIRED:   ['status-cancelled', 'Expired']
};

let toCancel = null;
let currentTab = 'upcoming';
let allUserBookings = null;

function unwrap(res) {
  if (!res) return [];
  if (Array.isArray(res)) return res;
  if (Array.isArray(res.data)) return res.data;
  if (Array.isArray(res.content)) return res.content;
  if (res.data && Array.isArray(res.data.content)) return res.data.content;
  if (res.data && res.data.data && Array.isArray(res.data.data.content)) return res.data.data.content;
  return [];
}

function getEventFromCacheOrLocal(eventId) {
  return window.EsCache?.getEvent(eventId) || null;
}

function bookingCard(b) {
  const ev = getEventFromCacheOrLocal(b.eventId);
  const isEventCancelled = ev?.status === 'CANCELLED';
  const isCancelled = b.status === 'CANCELLED' || b.status === 'EXPIRED' || isEventCancelled;

  let cls = 'status-pending';
  let label = b.status;
  if (isEventCancelled) {
    cls = 'status-cancelled';
    label = 'Event Cancelled';
  } else if (statusMap[b.status]) {
    [cls, label] = statusMap[b.status];
  }

  const ticketCount = (b.items || []).reduce((s, i) => s + i.quantity, 0);

  const fallbackSvg = `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='200' viewBox='0 0 300 200'%3E%3Crect fill='%23F8E9E6' width='300' height='200'/%3E%3Ctext fill='%23C68B8F' font-family='sans-serif' font-size='16' font-weight='bold' x='50%25' y='50%25' text-anchor='middle' dy='.3em'%3E🎟️ EventSphere%3C/text%3E%3C/svg%3E`;
  const img = (ev && ev.bannerUrl && ev.bannerUrl.trim() !== '') ? ev.bannerUrl : fallbackSvg;

  const dateLine = ev?.startDatetime 
    ? new Date(ev.startDatetime).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) 
    : 'Date TBA';
  const venueLine = ev?.venueName || '';

  const safeTitle = (b.eventTitle || 'Event').replace(/'/g, "\\'");
  const safeRef = (b.bookingReference || b.id || '').toString().replace(/'/g, "\\'");

  return `
  <div class="event-card flex-row p-0 overflow-hidden shadow-sm" style="flex-direction:row; align-items:stretch; min-height:140px; border-radius: var(--radius-md);">
    <div style="width:160px; min-width:160px; background: linear-gradient(135deg, var(--blush-soft) 0%, var(--lavender-soft) 100%);" class="img-wrap position-relative">
      <img src="${img}" alt="${b.eventTitle}" loading="lazy" decoding="async" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null; this.src='${fallbackSvg}';">
    </div>
    <div class="body w-100 p-3 d-flex flex-row align-items-center justify-content-between gap-3 flex-wrap">
      <div>
        <span class="status-badge ${cls} mb-2 d-inline-flex">${label}</span>
        <h5 class="title mb-1 fw-bold">${b.eventTitle}</h5>
        <div class="meta text-muted small mb-1">
          <i class="bi bi-calendar3 me-1"></i> ${dateLine} 
          ${venueLine ? `· <i class="bi bi-geo-alt ms-1 me-1"></i> ${venueLine}` : ''}
        </div>
        <div class="meta fw-semibold small mb-1">${ticketCount} ticket(s) · LKR ${Number(b.totalAmount || 0).toLocaleString()}</div>
        <div class="text-muted-soft" style="font-size:0.75rem;">Ref: <code>${b.bookingReference || b.id}</code></div>
      </div>
      
      <div class="d-flex flex-column gap-2">
        ${isEventCancelled ? `
          <button class="btn btn-outline-danger btn-sm" onclick="showCancellationNotice('${safeTitle}', '${safeRef}', ${Number(b.totalAmount || 0)})">
            <i class="bi bi-info-circle me-1"></i> Refund Info
          </button>
        ` : (
          b.status === 'CONFIRMED' ? `<a href="ticket.html?bookingId=${b.id}" class="btn btn-quiet btn-sm"><i class="bi bi-qr-code me-1"></i>View Ticket</a>` : ''
        )}
        ${!isEventCancelled && b.status === 'PENDING' ? `<a href="booking.html?eventId=${b.eventId}&bookingId=${b.id}" class="btn btn-primary btn-sm">Complete payment</a>` : ''}
        ${!isEventCancelled && b.status === 'PENDING' ? `<button class="btn btn-danger-soft btn-sm" onclick="askCancel(${b.id})">Cancel Booking</button>` : ''}
      </div>
    </div>
  </div>`;
}

function showCancellationNotice(eventTitle, bookingRef, amount) {
  let modalEl = document.getElementById('cancelNoticeModal');
  if (!modalEl) {
    modalEl = document.createElement('div');
    modalEl.className = 'modal fade';
    modalEl.id = 'cancelNoticeModal';
    modalEl.tabIndex = -1;
    document.body.appendChild(modalEl);
  }
  modalEl.innerHTML = `
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-white" style="background:#13151f; border:1px solid rgba(239,68,68,0.3); border-radius:16px;">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-danger d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-octagon-fill"></i> Event Cancelled by Host
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body py-3">
          <p class="text-white mb-2 fw-semibold" style="font-size:1.05rem;">${eventTitle}</p>
          <div class="p-3 mb-3 rounded-3" style="background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2);">
            <div class="d-flex justify-content-between small text-muted-soft mb-1">
              <span>Booking Reference:</span>
              <span class="text-white font-monospace">REF: #${bookingRef}</span>
            </div>
            <div class="d-flex justify-content-between small text-muted-soft">
              <span>Paid Amount:</span>
              <span class="text-white fw-bold">LKR ${amount.toLocaleString()}</span>
            </div>
          </div>
          <p class="small text-muted-soft mb-2" style="line-height:1.6;">
            This event has been called off by the event organizer. All digital passes and QR admission codes for this event have been voided and cannot be used for entry.
          </p>
          <div class="card p-3" style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:12px;">
            <div class="fw-bold text-white small mb-1"><i class="bi bi-credit-card-2-front me-1 text-primary"></i> Refund Settlement</div>
            <div class="small text-muted-soft" style="font-size:0.8rem; line-height:1.5;">
              Refunds are issued directly to the original card or payment method used during checkout via PayHere IPG. Processing times typically take 3 to 7 business days depending on your issuing bank.
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-quiet btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  `;
  const bsModal = new bootstrap.Modal(modalEl);
  bsModal.show();
}

function emptyState(tab) {
  return `<div class="state-block text-center py-5">
    <div class="mb-3 fs-1 text-muted">🎟️</div>
    <h3 class="fw-bold">No ${tab} bookings</h3>
    <p class="text-muted-soft">When you have ${tab} bookings, they will appear here.</p>
    <a href="../index.html" class="btn btn-primary btn-sm mt-2">Discover events</a>
  </div>`;
}

function renderBookingsTab(tab = currentTab) {
  currentTab = tab;
  const list = document.getElementById('bookingsList');
  if (!allUserBookings || !allUserBookings.length) {
    list.innerHTML = emptyState(tab);
    return;
  }

  const now = new Date();
  const filtered = allUserBookings.filter(b => {
    const ev = getEventFromCacheOrLocal(b.eventId);
    const isEventCancelled = ev?.status === 'CANCELLED';
    const isCancelled = b.status === 'CANCELLED' || b.status === 'EXPIRED' || isEventCancelled;
    const eventTime = ev?.startDatetime ? new Date(ev.startDatetime) : null;

    if (tab === 'upcoming') {
      return !isCancelled && (b.status === 'CONFIRMED' || b.status === 'PENDING') && (!eventTime || eventTime >= now);
    } else if (tab === 'past') {
      return !isCancelled && b.status === 'CONFIRMED' && eventTime && eventTime < now;
    } else if (tab === 'cancelled') {
      return isCancelled;
    }
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = emptyState(tab);
    return;
  }

  list.innerHTML = filtered.map(bookingCard).join('');
}

async function ensureEventDetails(bookings) {
  const uniqueEventIds = [...new Set(bookings.map(b => b.eventId).filter(Boolean))];
  const missing = uniqueEventIds.filter(id => !window.EsCache?.getEvent(id));
  if (missing.length) {
    await Promise.all(missing.map(async id => {
      try {
        await EventsAPI.getById(id);
      } catch (e) {}
    }));
    // Re-render once images/dates are cached
    renderBookingsTab(currentTab);
  }
}

async function loadBookings(tab = 'upcoming') {
  currentTab = tab;
  const list = document.getElementById('bookingsList');

  // STEP 1: If already in memory, render immediately (0ms instant tab switch)
  if (allUserBookings !== null) {
    renderBookingsTab(tab);
    return;
  }

  // STEP 2: Check sessionStorage cache
  const user = EsAuthStore.getUser();
  const uid = user?.id || user?.userId || 'me';
  const cached = window.EsCache?.getUserBookings(uid);
  if (cached) {
    allUserBookings = unwrap(cached);
    renderBookingsTab(tab);
    ensureEventDetails(allUserBookings);
  } else {
    // Show sleek shimmer skeletons while waiting for first fetch
    list.innerHTML = Array(3).fill('<div class="es-skeleton rounded-3 mb-3" style="height:140px;"></div>').join('');
  }

  // STEP 3: Fetch fresh from backend (SWR)
  try {
    const raw = await BookingsAPI.myBookings({
      size: 50,
      onRevalidate: (fresh) => {
        allUserBookings = unwrap(fresh);
        if (window.EsCache) window.EsCache.setUserBookings(uid, fresh);
        renderBookingsTab(currentTab);
        ensureEventDetails(allUserBookings);
      }
    });

    allUserBookings = unwrap(raw);
    if (window.EsCache) window.EsCache.setUserBookings(uid, raw);
    renderBookingsTab(tab);
    ensureEventDetails(allUserBookings);
  } catch (e) {
    if (!allUserBookings) {
      list.innerHTML = `
        <div class="state-block text-center py-5">
          <div class="mb-3 fs-1 text-warning"><i class="bi bi-cloud-slash"></i></div>
          <h4 class="fw-bold text-white mb-2">Could not load bookings</h4>
          <p class="text-muted-soft mb-3" style="max-width:440px; margin:0 auto; font-size:0.9rem;">
            ${e.message || 'The server may be waking up from cold standby (Render Free Tier). Please wait a moment.'}
          </p>
          <button class="btn btn-primary btn-sm" onclick="loadBookings('${tab}')">
            <i class="bi bi-arrow-clockwise me-1"></i> Retry Connection
          </button>
        </div>`;
    }
  }
}

document.getElementById('bookingTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('#bookingTabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderBookingsTab(btn.getAttribute('data-tab'));
});

function askCancel(id) {
  toCancel = id;
  const modalEl = document.getElementById('cancelModal');
  if (modalEl) bootstrap.Modal.getOrCreateInstance(modalEl).show();
}

document.getElementById('confirmCancelBtn').addEventListener('click', async () => {
  try {
    await BookingsAPI.cancel(toCancel);
    esToast('Booking cancelled', 'success');
    // Optimistically update local booking status
    if (allUserBookings) {
      const target = allUserBookings.find(b => b.id === toCancel);
      if (target) target.status = 'CANCELLED';
    }
    renderBookingsTab(currentTab);
  } catch (e) {
    esToast(e.message || 'Could not cancel this booking', 'error');
  }
  bootstrap.Modal.getInstance(document.getElementById('cancelModal'))?.hide();
});

loadBookings('upcoming');
</script>
</body>
</html>
