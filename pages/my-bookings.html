<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="bookings">

<nav class="es-navbar">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="../index.html" class="brand"><span class="sparkle" id="brandSparkle"></span>EventSphere</a>
    <button class="navbar-toggler d-lg-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"><i class="bi bi-list fs-3"></i></button>
    <div class="collapse navbar-collapse d-lg-flex justify-content-lg-center" id="navLinks">
      <ul class="navbar-nav gap-lg-2 mt-3 mt-lg-0">
        <li class="nav-item"><a class="nav-link" data-nav="home" href="../index.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="events" href="events.html">Categories</a></li>
        <li class="nav-item"><a class="nav-link active" data-nav="bookings" href="my-bookings.html">My Bookings</a></li>
      </ul>
    </div>
    <div class="d-flex align-items-center gap-2"><div id="navAuthSlot" class="d-flex align-items-center gap-2"></div></div>
  </div>
</nav>

<header class="section-sm pb-0">
  <div class="container-narrow">
    <p class="eyebrow">Your experiences</p>
    <h1 style="font-size:2.4rem;">My Bookings</h1>
  </div>
</header>

<section class="section-sm">
  <div class="container-narrow">
    <ul class="nav mb-4" style="gap:0.5rem;" id="bookingTabs">
      <li><button class="btn btn-quiet active" data-tab="upcoming">Upcoming</button></li>
      <li><button class="btn btn-quiet" data-tab="past">Past</button></li>
      <li><button class="btn btn-quiet" data-tab="cancelled">Cancelled</button></li>
    </ul>

    <div id="bookingsList" class="d-flex flex-column gap-3"></div>
  </div>
</section>

<!-- Cancel confirmation modal -->
<div class="modal fade es-modal" id="cancelModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <div class="modal-body text-center">
        <h4 class="mb-2">Cancel this booking?</h4>
        <p class="text-muted-soft">This can't be undone. Refunds follow the event's cancellation policy.</p>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button class="btn btn-outline-soft" data-bs-dismiss="modal">Keep booking</button>
        <button class="btn btn-danger-soft" id="confirmCancelBtn">Cancel booking</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/events.js"></script>
<script src="../js/api/bookings.js"></script>
<script src="../js/api/payments.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/nav.js"></script>
<script src="../js/utils/ai-widget.js"></script>
<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;

const statusMap = {
  PENDING:   ['status-pending',   'Pending payment'],
  CONFIRMED: ['status-confirmed', 'Confirmed'],
  CANCELLED: ['status-cancelled', 'Cancelled'],
  EXPIRED:   ['status-cancelled', 'Expired']
};

let toCancel = null;
let currentTab = 'upcoming';
let eventCache = {};

function unwrap(res) {
  if (!res) return [];
  if (Array.isArray(res)) return res;
  if (Array.isArray(res.data)) return res.data;
  if (Array.isArray(res.content)) return res.content;
  if (res.data && Array.isArray(res.data.content)) return res.data.content;
  if (res.data && res.data.data && Array.isArray(res.data.data.content)) return res.data.data.content;
  return [];
}

function bookingCard(b) {
  const [cls, label] = statusMap[b.status] || ['status-pending', b.status];
  const ev = eventCache[b.eventId];
  const ticketCount = (b.items || []).reduce((s, i) => s + i.quantity, 0);

  const fallbackSvg = `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='200' viewBox='0 0 300 200'%3E%3Crect fill='%23F8E9E6' width='300' height='200'/%3E%3Ctext fill='%23C68B8F' font-family='sans-serif' font-size='16' font-weight='bold' x='50%25' y='50%25' text-anchor='middle' dy='.3em'%3E🎟️ EventSphere%3C/text%3E%3C/svg%3E`;
  const img = (ev && ev.bannerUrl && ev.bannerUrl.trim() !== '') ? ev.bannerUrl : fallbackSvg;

  const dateLine = ev?.startDatetime 
    ? new Date(ev.startDatetime).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) 
    : 'Date TBA';
  const venueLine = ev?.venueName || '';

  return `
  <div class="event-card flex-row p-0 overflow-hidden shadow-sm" style="flex-direction:row; align-items:stretch; min-height:140px; border-radius: var(--radius-md);">
    <div style="width:160px; min-width:160px; background: linear-gradient(135deg, var(--blush-soft) 0%, var(--lavender-soft) 100%);" class="img-wrap position-relative">
      <img src="${img}" alt="${b.eventTitle}" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null; this.src='${fallbackSvg}';">
    </div>
    <div class="body w-100 p-3 d-flex flex-row align-items-center justify-content-between gap-3 flex-wrap">
      <div>
        <span class="status-badge ${cls} mb-2 d-inline-flex">${label}</span>
        <h5 class="title mb-1 fw-bold">${b.eventTitle}</h5>
        <div class="meta text-muted small mb-1">
          <i class="bi bi-calendar3 me-1"></i> ${dateLine} 
          ${venueLine ? `· <i class="bi bi-geo-alt ms-1 me-1"></i> ${venueLine}` : ''}
        </div>
        <div class="meta fw-semibold small mb-1">${ticketCount} ticket(s) · LKR ${Number(b.totalAmount || 0).toLocaleString()}</div>
        <div class="text-muted-soft" style="font-size:0.75rem;">Ref: <code>${b.bookingReference || b.id}</code></div>
      </div>
      
      <div class="d-flex flex-column gap-2">
        ${b.status === 'CONFIRMED' ? `<a href="ticket.html?bookingId=${b.id}" class="btn btn-quiet btn-sm"><i class="bi bi-qr-code me-1"></i>View Ticket</a>` : ''}
        ${b.status === 'PENDING' ? `<a href="booking.html?eventId=${b.eventId}&bookingId=${b.id}" class="btn btn-primary btn-sm">Complete payment</a>` : ''}
        ${b.status === 'PENDING' ? `<button class="btn btn-danger-soft btn-sm" onclick="askCancel(${b.id})">Cancel Booking</button>` : ''}
      </div>
    </div>
  </div>`;
}

function emptyState(tab) {
  return `<div class="state-block text-center py-5">
    <div class="mb-3 fs-1 text-muted">🎟️</div>
    <h3 class="fw-bold">No ${tab} bookings</h3>
    <p class="text-muted-soft">When you have ${tab} bookings, they will appear here.</p>
    <a href="../index.html" class="btn btn-primary btn-sm mt-2">Discover events</a>
  </div>`;
}

async function loadBookings(tab = 'upcoming') {
  currentTab = tab;
  const list = document.getElementById('bookingsList');
  list.innerHTML = `<div class="text-center py-5 text-muted-soft"><i class="bi bi-arrow-repeat spin fs-4 d-block mb-2"></i> Loading ${tab} bookings...</div>`;

  try {
    const raw = await BookingsAPI.myBookings({ tab: tab, size: 50 });
    const allBookings = unwrap(raw);

    if (!allBookings.length) {
      list.innerHTML = emptyState(tab);
      return;
    }

    // Pre-fetch all event details first to accurately check event dates
    const uniqueEventIds = [...new Set(allBookings.map(b => b.eventId).filter(Boolean))];
    await Promise.all(uniqueEventIds.map(async id => {
      if (!eventCache[id]) {
        try {
          const rawEv = await EventsAPI.getById(id);
          eventCache[id] = rawEv?.data || rawEv;
        } catch (e) { /* degrades gracefully */ }
      }
    }));

    // ✨ Accurate Client-Side Validation ✨
    const now = new Date();
    const filtered = allBookings.filter(b => {
      const ev = eventCache[b.eventId];
      const eventTime = ev?.startDatetime ? new Date(ev.startDatetime) : null;

      if (tab === 'upcoming') {
        // Confirmed or Pending events in the future
        return (b.status === 'CONFIRMED' || b.status === 'PENDING') && (!eventTime || eventTime >= now);
      } else if (tab === 'past') {
        // Confirmed events in the past
        return b.status === 'CONFIRMED' && eventTime && eventTime < now;
      } else if (tab === 'cancelled') {
        // Cancelled or Expired events only
        return b.status === 'CANCELLED' || b.status === 'EXPIRED';
      }
      return true;
    });

    if (!filtered.length) {
      list.innerHTML = emptyState(tab);
      return;
    }

    list.innerHTML = filtered.map(bookingCard).join('');
  } catch (e) {
    list.innerHTML = `<div class="state-block text-center py-5 text-danger"><h3>Could not load bookings</h3><p>${e.message || 'Is the server running?'}</p></div>`;
  }
}

document.getElementById('bookingTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('#bookingTabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadBookings(btn.getAttribute('data-tab'));
});

function askCancel(id) {
  toCancel = id;
  const modalEl = document.getElementById('cancelModal');
  if (modalEl) bootstrap.Modal.getOrCreateInstance(modalEl).show();
}

document.getElementById('confirmCancelBtn').addEventListener('click', async () => {
  try {
    await BookingsAPI.cancel(toCancel);
    esToast('Booking cancelled', 'success');
    loadBookings(currentTab);
  } catch (e) {
    esToast(e.message || 'Could not cancel this booking', 'error');
  }
  bootstrap.Modal.getInstance(document.getElementById('cancelModal'))?.hide();
});

loadBookings('upcoming');
</script>
</body>
</html>
