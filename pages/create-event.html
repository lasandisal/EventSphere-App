<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageBrowserTitle">Create Event — EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="organizer">

<nav class="es-navbar">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="../index.html" class="brand"><span class="sparkle" id="brandSparkle"></span>EventSphere</a>
    <span class="pill-badge pill-lavender" id="roleBadge">Organizer</span>
    <div id="navAuthSlot" class="d-flex align-items-center gap-2"></div>
  </div>
</nav>

<section class="section-sm">
  <div class="container-narrow" style="max-width:760px;">
    <a href="organizer-dashboard.html" id="backToDashLink" class="text-muted-soft" style="font-size:0.85rem;"><i class="bi bi-arrow-left"></i> Back to dashboard</a>
    <h2 class="mt-2 mb-4" id="mainHeading">Create a New Event</h2>

    <form id="createEventForm" class="d-flex flex-column gap-4">

      <!-- Basic Information -->
      <div class="filter-bar">
        <h3 class="mb-3" style="font-size:1.2rem;">Basic Information</h3>
        <div class="d-flex flex-column gap-3">
          <div>
            <label class="form-label">Event name</label>
            <input class="form-control" name="title" id="eventTitle" required placeholder="e.g. Golden Hour Acoustic Night">
          </div>
          <div>
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" id="eventDescription" rows="4" placeholder="What should attendees expect?"></textarea>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <select class="form-select" name="categoryId" id="categorySelect" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Event banner image</label>
              <input class="form-control" type="file" id="eventImageInput" name="image" accept="image/*">
              <div id="imagePreview" class="mt-2"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Date & Location -->
      <div class="filter-bar">
        <h3 class="mb-3" style="font-size:1.2rem;">Date &amp; Location</h3>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Date</label>
            <input class="form-control" type="date" name="date" id="eventDate" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Start time</label>
            <input class="form-control" type="time" name="time" id="eventStartTime" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">End time</label>
            <input class="form-control" type="time" name="endTime" id="eventEndTime" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Venue</label>
            <select class="form-select" name="venueId" id="venueSelect" required></select>
          </div>
        </div>
      </div>

      <!-- Ticket Types -->
      <div class="filter-bar">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 style="font-size:1.2rem;" class="mb-0">Ticket Types</h3>
          <button type="button" class="btn btn-outline-soft btn-sm" id="addTicketType"><i class="bi bi-plus-lg"></i> Add Ticket Type</button>
        </div>
        <div id="ticketTypeRows" class="d-flex flex-column gap-3"></div>
      </div>

      <!-- Submit Actions -->
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-outline-soft btn-lg" id="btnDraft" data-mode="draft">Save as Draft</button>
        <button type="submit" class="btn btn-primary btn-lg" id="btnPublish" data-mode="publish">Publish Event</button>
      </div>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/events.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/nav.js"></script>

<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;
if (!EsAuthStore.isLoggedIn()) window.location.href = 'login.html';

const urlParams = new URLSearchParams(window.location.search);
const editEventId = urlParams.get('edit') || urlParams.get('id');
const isAdmin = EsAuthStore.hasRole('ADMIN');

// Synchronously reflect Edit Mode immediately if edit param is present
if (editEventId) {
  document.getElementById('pageBrowserTitle').textContent = 'Edit Event — EventSphere';
  document.getElementById('mainHeading').textContent = 'Edit Event';
  document.getElementById('btnPublish').textContent = 'Update & Publish';
  document.getElementById('btnDraft').textContent = 'Update as Draft';
}

// Adjust Back button & role badge depending on user role
if (isAdmin) {
  document.getElementById('roleBadge').textContent = 'Admin';
  const backLink = document.getElementById('backToDashLink');
  if (backLink) {
    backLink.href = 'admin-dashboard.html';
    backLink.innerHTML = '<i class="bi bi-arrow-left"></i> Back to admin dashboard';
  }
}

let ttCount = 0;
function addTicketTypeRow(name = '', price = '', qty = '') {
  ttCount++;
  const id = ttCount;
  const div = document.createElement('div');
  div.className = 'ticket-type-card p-3 border rounded-3 bg-white';
  div.innerHTML = `
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label small text-muted mb-1">Ticket Name</label>
        <input class="form-control" placeholder="e.g. General, VIP" name="tt-name-${id}" value="${name}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">Price (LKR)</label>
        <input type="number" min="0" class="form-control" name="tt-price-${id}" value="${price}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">Total Quantity</label>
        <input type="number" min="1" class="form-control" name="tt-qty-${id}" value="${qty}" required>
      </div>
      <div class="col-md-1">
        <button type="button" class="btn btn-danger-soft w-100" onclick="this.closest('.ticket-type-card').remove()">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>`;
  document.getElementById('ticketTypeRows').appendChild(div);
}
document.getElementById('addTicketType')?.addEventListener('click', () => addTicketTypeRow());

// ---- Cloudinary unsigned upload ----
async function uploadEventImage(file) {
  const cloudName = window.ES_CONFIG?.CLOUDINARY_CLOUD_NAME;
  const uploadPreset = window.ES_CONFIG?.CLOUDINARY_UPLOAD_PRESET;

  if (!cloudName || !uploadPreset) {
    throw new Error('Cloudinary config missing. Set CLOUDINARY_CLOUD_NAME & CLOUDINARY_UPLOAD_PRESET in js/env.js.');
  }

  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', uploadPreset);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, { method: 'POST', body: fd });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'Image upload failed');
  }
  const data = await res.json();
  return data.secure_url;
}

let uploadedBannerUrl = null;
let uploadInProgress = false;

document.getElementById('eventImageInput')?.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  const preview = document.getElementById('imagePreview');
  if (!file) { uploadedBannerUrl = null; preview.innerHTML = ''; return; }

  preview.innerHTML = `<div class="text-muted-soft small"><i class="bi bi-arrow-repeat spin me-1"></i>Uploading image...</div>`;
  uploadInProgress = true;
  try {
    uploadedBannerUrl = await uploadEventImage(file);
    preview.innerHTML = `<img src="${uploadedBannerUrl}" style="max-width:220px;border-radius:8px;" alt="Banner preview">`;
  } catch (err) {
    uploadedBannerUrl = null;
    preview.innerHTML = `<div class="text-danger small">${err.message || 'Upload failed'}</div>`;
  } finally {
    uploadInProgress = false;
  }
});

async function loadOptions() {
  const catSel = document.getElementById('categorySelect');
  const venSel = document.getElementById('venueSelect');
  try {
    const rawCats = await CategoriesAPI.getAll();
    const cats = Array.isArray(rawCats) ? rawCats : (rawCats?.data || []);
    catSel.innerHTML = '<option value="">Select Category</option>' + 
      cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  } catch (e) {
    esToast('Could not load categories.', 'error');
  }
  try {
    const rawVens = await VenuesAPI.getAll();
    const vens = Array.isArray(rawVens) ? rawVens : (rawVens?.data || []);
    venSel.innerHTML = '<option value="">Select Venue</option>' + 
      vens.map(v => `<option value="${v.id}">${v.name} (${v.city || ''})</option>`).join('');
  } catch (e) {
    esToast('Could not load venues.', 'error');
  }
}

// Prefill event data if in Edit Mode
async function loadExistingEventData() {
  if (!editEventId) {
    // Default blank ticket rows for creation
    addTicketTypeRow('General Admission', 1500, 100);
    return;
  }

  document.getElementById('pageBrowserTitle').textContent = 'Edit Event — EventSphere';
  document.getElementById('mainHeading').textContent = 'Edit Event';
  document.getElementById('btnPublish').textContent = 'Update & Publish';
  document.getElementById('btnDraft').textContent = 'Update as Draft';

  try {
    const rawEvent = await EventsAPI.getById(editEventId);
    const ev = rawEvent?.data || rawEvent;

    if (!ev) {
      esToast('Could not find event data for editing', 'error');
      return;
    }

    document.getElementById('eventTitle').value = ev.title || '';
    document.getElementById('eventDescription').value = ev.description || '';

    const catId = ev.categoryId || ev.category?.id;
    if (catId) {
      document.getElementById('categorySelect').value = catId;
    } else if (ev.categoryName) {
      const opts = Array.from(document.getElementById('categorySelect').options);
      const match = opts.find(o => o.text.trim().toLowerCase() === ev.categoryName.trim().toLowerCase());
      if (match) document.getElementById('categorySelect').value = match.value;
    }

    const venId = ev.venueId || ev.venue?.id;
    if (venId) {
      document.getElementById('venueSelect').value = venId;
    } else if (ev.venueName) {
      const opts = Array.from(document.getElementById('venueSelect').options);
      const match = opts.find(o => o.text.toLowerCase().includes(ev.venueName.trim().toLowerCase()));
      if (match) document.getElementById('venueSelect').value = match.value;
    }

    const banner = ev.bannerUrl || ev.imageUrl;
    if (banner) {
      uploadedBannerUrl = banner;
      document.getElementById('imagePreview').innerHTML = `<img src="${banner}" style="max-width:220px;border-radius:8px;" alt="Banner">`;
    }

    if (ev.startDatetime) {
      if (typeof ev.startDatetime === 'string' && ev.startDatetime.includes('T')) {
        const parts = ev.startDatetime.split('T');
        document.getElementById('eventDate').value = parts[0];
        document.getElementById('eventStartTime').value = parts[1].slice(0, 5);
      } else {
        const dt = new Date(ev.startDatetime);
        if (!isNaN(dt.getTime())) {
          const year = dt.getFullYear();
          const month = String(dt.getMonth() + 1).padStart(2, '0');
          const day = String(dt.getDate()).padStart(2, '0');
          document.getElementById('eventDate').value = `${year}-${month}-${day}`;
          document.getElementById('eventStartTime').value = `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        }
      }
    }
    if (ev.endDatetime) {
      if (typeof ev.endDatetime === 'string' && ev.endDatetime.includes('T')) {
        const parts = ev.endDatetime.split('T');
        document.getElementById('eventEndTime').value = parts[1].slice(0, 5);
      } else {
        const dt = new Date(ev.endDatetime);
        if (!isNaN(dt.getTime())) {
          document.getElementById('eventEndTime').value = `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        }
      }
    }

    // Populate existing ticket types
    document.getElementById('ticketTypeRows').innerHTML = '';
    if (ev.ticketTypes && ev.ticketTypes.length > 0) {
      ev.ticketTypes.forEach(tt => {
        addTicketTypeRow(tt.name, tt.price, tt.totalQuantity || tt.availableQuantity);
      });
    } else {
      addTicketTypeRow('General Admission', 1500, 100);
    }

  } catch (e) {
    console.error('Failed to load event for editing:', e);
    esToast('Could not load event data for editing', 'error');
  }
}

document.getElementById('createEventForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const mode = e.submitter?.getAttribute('data-mode') || 'draft';

  if (uploadInProgress) {
    esToast('Still uploading the image — please wait.', 'error');
    return;
  }

  const fd = new FormData(e.target);
  const date = fd.get('date');
  const startDatetime = `${date}T${fd.get('time')}:00`;
  const endDatetime = `${date}T${fd.get('endTime')}:00`;

  const payload = {
    title: fd.get('title'),
    description: fd.get('description'),
    categoryId: Number(fd.get('categoryId')),
    venueId: Number(fd.get('venueId')),
    startDatetime,
    endDatetime,
    bannerUrl: uploadedBannerUrl || null
  };

  const ticketTypes = [];
  document.querySelectorAll('#ticketTypeRows .ticket-type-card').forEach(card => {
    const nameInput = card.querySelector('input[name^="tt-name-"]');
    const priceInput = card.querySelector('input[name^="tt-price-"]');
    const qtyInput = card.querySelector('input[name^="tt-qty-"]');
    if (nameInput && nameInput.value.trim()) {
      ticketTypes.push({
        name: nameInput.value.trim(),
        price: Number(priceInput.value || 0),
        totalQuantity: Number(qtyInput.value || 0)
      });
    }
  });

  try {
    let savedEvent;
    if (editEventId) {
      // Update existing
      savedEvent = await EventsAPI.updateEvent ? await EventsAPI.updateEvent(editEventId, payload) : await EventsAPI.createEvent(payload);
      esToast('Event updated successfully!', 'success');
    } else {
      // Create new
      savedEvent = await EventsAPI.createEvent(payload);
      for (const tt of ticketTypes) {
        await EventsAPI.addTicketType(savedEvent.id, tt);
      }
      if (mode === 'publish') await EventsAPI.publishEvent(savedEvent.id);
      esToast(mode === 'publish' ? 'Event published successfully!' : 'Event saved as draft!', 'success');
    }

    setTimeout(() => {
      window.location.href = isAdmin ? 'admin-dashboard.html' : 'organizer-dashboard.html';
    }, 800);
  } catch (err) {
    esToast(err.message || 'Could not save the event', 'error');
  }
});

async function init() {
  await loadOptions();
  await loadExistingEventData();
}

init();
</script>
</body>
</html>
