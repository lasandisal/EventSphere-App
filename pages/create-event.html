<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Event — EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="organizer">

<nav class="es-navbar">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="../index.html" class="brand"><span class="sparkle" id="brandSparkle"></span>EventSphere</a>
    <span class="pill-badge pill-lavender">Organizer</span>
    <div id="navAuthSlot" class="d-flex align-items-center gap-2"></div>
  </div>
</nav>

<section class="section-sm">
  <div class="container-narrow" style="max-width:760px;">
    <a href="organizer-dashboard.html" class="text-muted-soft" style="font-size:0.85rem;"><i class="bi bi-arrow-left"></i> Back to dashboard</a>
    <h2 class="mt-2 mb-4">Create a New Event</h2>

    <form id="createEventForm" class="d-flex flex-column gap-4">

      <div class="filter-bar">
        <h3 class="mb-3" style="font-size:1.2rem;">Basic Information</h3>
        <div class="d-flex flex-column gap-3">
          <div><label class="form-label">Event name</label><input class="form-control" name="title" required placeholder="e.g. Golden Hour Acoustic Night"></div>
          <div><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4" placeholder="What should attendees expect?"></textarea></div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <select class="form-select" name="categoryId" id="categorySelect"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Event image</label>
              <input class="form-control" type="file" name="image" accept="image/*">
            </div>
          </div>
        </div>
      </div>

      <div class="filter-bar">
        <h3 class="mb-3" style="font-size:1.2rem;">Date &amp; Location</h3>
        <div class="row g-3">
          <div class="col-md-3"><label class="form-label">Date</label><input class="form-control" type="date" name="date" required></div>
          <div class="col-md-3"><label class="form-label">Start time</label><input class="form-control" type="time" name="time" required></div>
          <div class="col-md-3"><label class="form-label">End time</label><input class="form-control" type="time" name="endTime" required></div>
          <div class="col-md-3">
            <label class="form-label">Venue</label>
            <select class="form-select" name="venueId" id="venueSelect"></select>
          </div>
        </div>
      </div>


      <div class="filter-bar">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 style="font-size:1.2rem;" class="mb-0">Ticket Types</h3>
          <button type="button" class="btn btn-outline-soft btn-sm" id="addTicketType"><i class="bi bi-plus-lg"></i> Add Ticket Type</button>
        </div>
        <div id="ticketTypeRows" class="d-flex flex-column gap-3"></div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-outline-soft btn-lg" data-mode="draft">Save as Draft</button>
        <button type="submit" class="btn btn-primary btn-lg" data-mode="publish">Publish Event</button>
      </div>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/events.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<!-- <script src="../js/utils/mock-data.js"></script> -->
<script src="../js/utils/nav.js"></script>
<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;
if (!EsAuthStore.isLoggedIn()) window.location.href = 'login.html';

let ttCount = 0;
function ticketTypeRow() {
  ttCount++;
  const id = ttCount;
  const div = document.createElement('div');
  div.className = 'ticket-type-card';
  div.innerHTML = `
    <div class="row g-3 align-items-end">
      <div class="col-md-5"><label class="form-label">Name</label><input class="form-control" placeholder="e.g. General, VIP" name="tt-name-${id}"></div>
      <div class="col-md-3"><label class="form-label">Price (LKR)</label><input type="number" min="0" class="form-control" name="tt-price-${id}"></div>
      <div class="col-md-3"><label class="form-label">Quantity</label><input type="number" min="1" class="form-control" name="tt-qty-${id}"></div>
      <div class="col-md-1"><button type="button" class="btn btn-danger-soft w-100" onclick="this.closest('.ticket-type-card').remove()"><i class="bi bi-trash"></i></button></div>
    </div>`;
  document.getElementById('ticketTypeRows').appendChild(div);
}
document.getElementById('addTicketType').addEventListener('click', ticketTypeRow);
ticketTypeRow(); ticketTypeRow();

// ---- Cloudinary unsigned upload — reads from window.ES_CONFIG ----
async function uploadEventImage(file) {
  const cloudName = window.ES_CONFIG?.CLOUDINARY_CLOUD_NAME;
  const uploadPreset = window.ES_CONFIG?.CLOUDINARY_UPLOAD_PRESET;

  if (!cloudName || !uploadPreset) {
    throw new Error('Cloudinary configuration missing. Set CLOUDINARY_CLOUD_NAME and CLOUDINARY_UPLOAD_PRESET in js/env.js.');
  }

  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', uploadPreset);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
    method: 'POST',
    body: fd
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'Image upload failed');
  }
  const data = await res.json();
  return data.secure_url; // this is what goes into bannerUrl — a real, permanent, direct image URL
}

// Live preview + upload-on-select, so the organizer sees the real hosted
// image (not just a local file picker) before they even submit the form.
let uploadedBannerUrl = null;
let uploadInProgress = false;
document.getElementById('eventImageInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  const preview = document.getElementById('imagePreview');
  if (!file) { uploadedBannerUrl = null; preview.innerHTML = ''; return; }

  preview.innerHTML = `<div class="text-muted-soft">Uploading image...</div>`;
  uploadInProgress = true;
  try {
    uploadedBannerUrl = await uploadEventImage(file);
    preview.innerHTML = `<img src="${uploadedBannerUrl}" style="max-width:220px;border-radius:12px;" alt="Event banner preview">`;
  } catch (err) {
    uploadedBannerUrl = null;
    preview.innerHTML = `<div class="text-danger">${err.message || 'Upload failed'} — the event can still be created without a banner image.</div>`;
  } finally {
    uploadInProgress = false;
  }
});

async function loadOptions() {
  const catSel = document.getElementById('categorySelect');
  const venSel = document.getElementById('venueSelect');
  try {
    const cats = await CategoriesAPI.getAll();
    (cats || []).forEach(c => catSel.add(new Option(c.name, c.id)));
    if (!cats || !cats.length) catSel.add(new Option('No categories yet — ask an admin to add one', ''));
  } catch (e) {
    esToast('Could not load categories.', 'error');
  }
  try {
    const vens = await VenuesAPI.getAll();
    (vens || []).forEach(v => venSel.add(new Option(v.name, v.id)));
    if (!vens || !vens.length) venSel.add(new Option('No venues yet — ask an admin to add one', ''));
  } catch (e) {
    esToast('Could not load venues.', 'error');
  }
}
loadOptions();

document.getElementById('createEventForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mode = e.submitter?.getAttribute('data-mode') || 'draft';

  if (uploadInProgress) {
    esToast('Still uploading the image — wait a moment and try again.', 'error');
    return;
  }

  const fd = new FormData(e.target);
  const date = fd.get('date');
  const startDatetime = `${date}T${fd.get('time')}:00`;
  const endDatetime = `${date}T${fd.get('endTime')}:00`;

  const payload = {
    title: fd.get('title'),
    description: fd.get('description'),
    categoryId: Number(fd.get('categoryId')),
    venueId: Number(fd.get('venueId')),
    startDatetime,
    endDatetime,
    bannerUrl: uploadedBannerUrl || null // null is fine — EventCreateRequestDTO.bannerUrl is optional
  };

  const ticketTypes = [];
  document.querySelectorAll('#ticketTypeRows .ticket-type-card').forEach(card => {
    const nameInput = card.querySelector('input[name^="tt-name-"]');
    const priceInput = card.querySelector('input[name^="tt-price-"]');
    const qtyInput = card.querySelector('input[name^="tt-qty-"]');
    if (nameInput && nameInput.value.trim()) {
      ticketTypes.push({
        name: nameInput.value.trim(),
        price: Number(priceInput.value || 0),
        totalQuantity: Number(qtyInput.value || 0)
      });
    }
  });

  if (mode === 'publish' && ticketTypes.length === 0) {
    esToast('Add at least one ticket type before publishing.', 'error');
    return;
  }

  try {
    const ev = await EventsAPI.createEvent(payload);
    for (const tt of ticketTypes) {
      await EventsAPI.addTicketType(ev.id, tt);
    }
    if (mode === 'publish') await EventsAPI.publishEvent(ev.id);
    esToast(mode === 'publish' ? 'Event published successfully' : 'Event saved as draft');
    setTimeout(() => window.location.href = 'organizer-dashboard.html', 700);
  } catch (err) {
    // Real error, always — no demo-mode fallback of any kind anymore.
    esToast(err.message || 'Could not create the event', 'error');
  }
});
</script>

</body>
</html>
