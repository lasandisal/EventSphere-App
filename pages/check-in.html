<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check In Attendees — EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="organizer">

<nav class="es-navbar">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="/index.html" class="brand"><span class="sparkle" id="brandSparkle"></span>EventSphere</a>
    <span class="pill-badge pill-lavender">Organizer</span>
    <div id="navAuthSlot" class="d-flex align-items-center gap-2"></div>
  </div>
</nav>

<section class="section text-center">
  <div class="container-narrow" style="max-width:520px;">
    <p class="eyebrow">Gate check-in</p>
    <h2 class="mb-2">Check In Attendees</h2>
    <p class="text-muted-soft mb-4">Scan the attendee's EventSphere ticket QR code.</p>

    <div class="scanner-frame mb-4">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="scan-line"></div>
      <i class="bi bi-qr-code-scan icon-camera"></i>
    </div>

    <button class="btn btn-primary btn-lg mb-4" id="simulateScan"><i class="bi bi-camera me-1"></i> Simulate Scan</button>

    <div class="text-muted-soft mb-2" style="font-size:0.85rem;">or search manually</div>
    <div class="hero-search mx-auto mb-4">
      <i class="bi bi-search text-muted"></i>
      <input type="text" id="manualCode" placeholder="Enter ticket code, e.g. ES-88123">
      <button class="btn btn-primary btn-sm" id="manualSearch">Search</button>
    </div>

    <div id="resultCard" class="d-none filter-bar text-start">
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="status-badge status-confirmed">✓ Ticket verified</span>
      </div>
      <div class="tk-row"><span>Attendee</span><b id="rAttendee"></b></div>
      <div class="tk-row"><span>Event</span><b id="rEvent"></b></div>
      <div class="tk-row"><span>Ticket type</span><b id="rType"></b></div>
      <div class="tk-row"><span>Ticket ID</span><b id="rId"></b></div>
      <button class="btn btn-primary w-100 mt-3" id="confirmCheckin">Confirm Check-in</button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/organizer.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/nav.js"></script>
<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;
if (!EsAuthStore.isLoggedIn()) window.location.href = '/pages/login.html';

async function showResult(code) {
  let result;
  try {
    result = await CheckInAPI.scan(code);
  } catch (e) {
    result = { attendeeName: 'Amaya Perera', eventTitle: 'AI & Innovation Summit', ticketType: 'VIP', ticketId: code || 'ES-88123' };
  }
  document.getElementById('rAttendee').textContent = result.attendeeName;
  document.getElementById('rEvent').textContent = result.eventTitle;
  document.getElementById('rType').textContent = result.ticketType;
  document.getElementById('rId').textContent = result.ticketId;
  document.getElementById('resultCard').classList.remove('d-none');
}

document.getElementById('simulateScan').addEventListener('click', () => showResult());
document.getElementById('manualSearch').addEventListener('click', () => showResult(document.getElementById('manualCode').value));
document.getElementById('confirmCheckin').addEventListener('click', () => {
  esToast('Entry granted');
  document.getElementById('resultCard').classList.add('d-none');
});
</script>
</body>
</html>
