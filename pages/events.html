<header class="section-sm pb-0">
  <div class="container-narrow text-center">
    <p class="eyebrow">All events</p>
    <h1 style="font-size:2.6rem;">Discover Events</h1>
    <p class="sub mx-auto">Something wonderful might be happening nearby.</p>
  </div>
</header>

<section class="section-sm pt-3">
  <div class="container-narrow">
    <div class="filter-bar mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Search</label>
          <input type="text" class="form-control" id="fKeyword" placeholder="Search events...">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Category</label>
          <select class="form-select" id="fCategory"><option value="">All</option></select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" id="fDate">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Location</label>
          <input type="text" class="form-control" id="fLocation" placeholder="City">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Price</label>
          <select class="form-select" id="fPrice">
            <option value="">Any</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-3">
        <button class="btn btn-primary" id="applyFilters">Apply Filters</button>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="text-muted-soft" id="resultCount">Loading events…</span>
    </div>

    <div class="es-pagination" id="pagination"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/events.js"></script>
<script src="../js/api/bookings.js"></script>
<script src="../js/utils/md5.js"></script>
<script src="../js/api/payments.js"></script>
<script src="../js/api/organizer.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<!-- <script src="../js/utils/mock-data.js"></script> -->
<script src="../js/utils/nav.js"></script>
<script src="../js/utils/ai-widget.js"></script>
<script>
const brandSp = document.getElementById('brandSparkle');
if (brandSp) brandSp.innerHTML = EsIcons.sparkle;

const params = new URLSearchParams(window.location.search);
let currentPage = 0;

function availabilityLabel(totalAvailable) {
  return totalAvailable > 0 && totalAvailable <= 10
    ? `<span class="availability-dot low">Few tickets left</span>`
    : `<span class="availability-dot">Tickets available</span>`;
}

function getCategoryPillClass(catName = '') {
  const name = String(catName).toLowerCase();
  if (name.includes('music') || name.includes('concert') || name.includes('art')) return 'pill-blush';
  if (name.includes('tech') || name.includes('innovation') || name.includes('digital') || name.includes('code') || name.includes('software')) return 'pill-blue';
  if (name.includes('sport') || name.includes('fitness') || name.includes('health') || name.includes('outdoor')) return 'pill-sage';
  if (name.includes('food') || name.includes('drink') || name.includes('dining')) return 'pill-beige';
  if (name.includes('business') || name.includes('workshop') || name.includes('edu')) return 'pill-lavender';
  return 'pill-lavender';
}

function eventCard(ev) {
  const title = ev.title || 'Untitled Event';
  const categoryName = ev.categoryName || 'General';
  const venueName = ev.venueName || 'TBA';
  const bannerUrl = ev.bannerUrl || `https://placehold.co/500x300/F7D6DE/9B4A63?text=${encodeURIComponent(title)}`;
  const pillCls = getCategoryPillClass(categoryName);

  let dateText = 'Date TBA', timeText = '';
  if (ev.startDatetime) {
    const d = new Date(ev.startDatetime);
    dateText = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    timeText = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  }

  // Real availability/price come from summing ticketTypes — there is no
  // flat ev.price or ev.availability field on the actual DTO.
  const prices = (ev.ticketTypes || []).map(t => Number(t.price));
  const priceText = prices.length === 0 ? 'Tickets TBA'
    : (Math.min(...prices) === 0 ? 'Free' : `From LKR ${Math.min(...prices).toLocaleString()}`);
  const totalAvailable = (ev.ticketTypes || []).reduce((s, t) => s + (t.availableQuantity || 0), 0);

  return `
  <div class="col-md-6 col-lg-4">
    <div class="event-card h-100">
      <div class="img-wrap">
        <span class="pill-badge ${pillCls}">${categoryName}</span>
        <img src="${bannerUrl}" alt="${title}">
      </div>
      <div class="body">
        <div class="title fw-bold mb-2 text-truncate" title="${title}">${title}</div>
        <div class="meta small mb-1"><i class="bi bi-calendar3 me-1"></i> <span>${dateText}${timeText ? `, ${timeText}` : ''}</span></div>
        <div class="meta small mb-3 text-truncate"><i class="bi bi-geo-alt me-1"></i> <span>${venueName}</span></div>
        <div class="price-row">
          <div><div class="price">${priceText}</div>${availabilityLabel(totalAvailable)}</div>
          <a href="event-details.html?id=${ev.id}" class="btn btn-quiet btn-sm">View Event</a>
        </div>
      </div>
    </div>
  </div>`;
}

function emptyState() {
  return `<div class="col-12 state-block">
    <span class="sparkle d-inline-block">${EsIcons.sparkle}</span>
    <h3>No events found</h3>
    <p>Try a different keyword or clear your filters.</p>
  </div>`;
}

async function loadCategories() {
  const sel = document.getElementById('fCategory');
  try {
    const cats = await CategoriesAPI.getAll();
    const list = Array.isArray(cats) ? cats : (cats?.content || []);
    list.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  } catch (e) {
    esToast('Could not load categories.', 'error');
  }
  if (params.get('categoryId')) sel.value = params.get('categoryId');
}

async function loadEvents(page = 0) {
  const grid = document.getElementById('eventsGrid');
  grid.innerHTML = Array(6).fill('<div class="col-md-6 col-lg-4"><div class="skeleton" style="height:320px;"></div></div>').join('');

  const keyword = document.getElementById('fKeyword').value;
  const categoryId = document.getElementById('fCategory').value;

  try {
    const res = await EventsAPI.searchPublished({ keyword, categoryId, page, size: 9 });
    const list = Array.isArray(res) ? res : (res?.content || []);
    const total = res?.totalElements ?? list.length;

    document.getElementById('resultCount').textContent = `${total} event${total === 1 ? '' : 's'} found`;
    grid.innerHTML = list.length ? list.map(eventCard).join('') : emptyState();
  } catch (e) {
    document.getElementById('resultCount').textContent = '0 events found';
    grid.innerHTML = `<div class="col-12 state-block"><h3>Could not load events</h3><p>${e.message || 'Is the backend running?'}</p></div>`;
  }
}

document.getElementById('applyFilters').addEventListener('click', () => loadEvents(0));
document.getElementById('fKeyword').value = params.get('keyword') || '';

loadCategories().then(() => loadEvents(0));
</script>

</body>
</html>
