<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Ticket — EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="bookings">

<nav class="es-navbar">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="../index.html" class="brand"><span class="sparkle" id="brandSparkle"></span>EventSphere</a>
    <div id="navAuthSlot" class="d-flex align-items-center gap-2"></div>
  </div>
</nav>

<section class="section">
  <div class="container-narrow">
    <div class="text-center mb-4">
      <p class="eyebrow">Present this at the entrance</p>
      <h2>Your Digital Ticket</h2>
    </div>

    <div class="digital-ticket">
      <div class="tk-header"><span class="sparkle" style="width:1.1em;height:1.1em;" id="tkSparkle"></span> EventSphere</div>
      <div class="tk-body">
        <div class="tk-event" id="tkEvent">Event name</div>
        <div class="tk-row"><span>Date</span><b id="tkDate">—</b></div>
        <div class="tk-row"><span>Time</span><b id="tkTime">—</b></div>
        <div class="tk-row"><span>Venue</span><b id="tkVenue">—</b></div>
        <div class="tk-row"><span>Attendee</span><b id="tkAttendee">—</b></div>
        <div class="tk-row"><span>Ticket type</span><b id="tkType">—</b></div>
      </div>
      <div class="ticket-perforation"></div>
      <div class="qr-wrap">
        <div class="qr-box"></div>
        <div class="text-muted-soft" style="font-size:0.78rem;">Present this QR code at the entrance</div>
        <div class="fw-semibold mt-1" id="tkId" style="font-size:0.85rem; letter-spacing:1px;">TICKET ID</div>
      </div>
    </div>

    <div class="text-center mt-4 d-flex gap-2 justify-content-center">
      <button class="btn btn-outline-soft" onclick="window.print()"><i class="bi bi-printer me-1"></i> Print</button>
      <button class="btn btn-primary"><i class="bi bi-download me-1"></i> Download</button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<!-- <script src="../js/utils/mock-data.js"></script> -->
<script src="../js/utils/nav.js"></script>
<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;
document.getElementById('tkSparkle').innerHTML = EsIcons.sparkle;
if (!EsAuthStore.isLoggedIn()) window.location.href = 'login.html';

// There is no backend endpoint that returns a ticket's QR image — QR codes
// are only ever generated once, server-side, and emailed at payment
// confirmation (see EmailServiceImpl). This page shows the real BOOKING
// record instead (attendee, ticket type, status) via a real API call, and
// is honest that the scannable QR itself lives in the confirmation email,
// not on this page — it was never faked here, and it isn't now either.
const bookingId = new URLSearchParams(window.location.search).get('bookingId');

async function loadTicket() {
  if (!bookingId) {
    document.getElementById('tkEvent').textContent = 'No booking specified';
    document.getElementById('tkAttendee').textContent = '—';
    return;
  }

  try {
    const b = await BookingsAPI.getById(bookingId);

    document.getElementById('tkEvent').textContent = b.eventTitle;
    document.getElementById('tkDate').textContent = b.confirmedAt
      ? new Date(b.confirmedAt).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })
      : '—';
    document.getElementById('tkTime').textContent = '';
    document.getElementById('tkVenue').textContent = '';

    const firstTicket = b.items?.[0]?.tickets?.[0];
    document.getElementById('tkAttendee').textContent = firstTicket?.attendeeName || '—';
    document.getElementById('tkType').textContent = b.items?.[0]?.ticketTypeName || '—';
    document.getElementById('tkId').textContent = 'Booking · ' + b.bookingReference;

    if (b.status !== 'CONFIRMED') {
      document.querySelector('.container-narrow')?.insertAdjacentHTML('afterbegin',
        `<div class="state-block"><p>This booking is <b>${b.status}</b> — a QR ticket only exists for confirmed, paid bookings.</p></div>`);
    } else {
      document.querySelector('.container-narrow')?.insertAdjacentHTML('beforeend',
        `<p class="text-muted-soft text-center mt-3">Your scannable QR code was emailed to you when payment was confirmed — this page shows your booking details, not the QR itself.</p>`);
    }
  } catch (e) {
    document.getElementById('tkEvent').textContent = 'Could not load this booking';
    document.getElementById('tkAttendee').textContent = e.message || 'Unknown error';
  }
}

loadTicket();
</script>

</body>
</html>
