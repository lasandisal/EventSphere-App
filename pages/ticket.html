<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Ticket — EventSphere</title>
<link rel="icon" type="image/png" href="../assets/images/logo.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/ticket.css">
</head>
<body data-page="bookings">

<!-- Navbar -->
<nav class="es-navbar no-print">
  <div class="container-narrow d-flex align-items-center justify-content-between">
    <a href="../index.html" class="brand text-decoration-none d-flex align-items-center">
      <img src="../assets/images/logo.png" alt="EventSphere Logo" class="brand-logo me-2">EventSphere
    </a>
    <div id="navAuthSlot" class="d-flex align-items-center gap-2"></div>
  </div>
</nav>

<section class="section py-4">
  <div class="container-narrow">
    <div class="text-center mb-4 no-print">
      <p class="eyebrow mb-1">Present this at the entrance</p>
      <h2>Your Digital Admission Passes</h2>
      <a href="my-bookings.html" class="btn btn-quiet btn-sm mt-1">
        <i class="bi bi-arrow-left me-1"></i> Back to My Bookings
      </a>
    </div>

    <!-- Ticket Cards Grid Slot -->
    <div class="ticket-grid" id="ticketsWrapper">
      <div class="text-center py-5 text-muted-soft col-12">
        <i class="bi bi-arrow-repeat spin fs-2 d-block mb-2"></i> Loading ticket pass...
      </div>
    </div>

    <!-- Print & Navigation Actions -->
    <div class="text-center mt-4 d-flex gap-2 justify-content-center no-print" id="ticketActions" style="display: none !important;">
      <button class="btn btn-outline-soft" onclick="window.print()">
        <i class="bi bi-printer me-1"></i> Print Tickets
      </button>
      <a href="my-bookings.html" class="btn btn-primary">
        <i class="bi bi-check2-circle me-1"></i> Done
      </a>
    </div>
  </div>
</section>

<!-- Core Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/events.js"></script>
<script src="../js/api/bookings.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/nav.js"></script>

<script>
const brandSp = document.getElementById('brandSparkle');
if (brandSp) brandSp.innerHTML = EsIcons.sparkle;

if (!EsAuthStore.isLoggedIn()) {
  window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
}

const bookingId = new URLSearchParams(window.location.search).get('bookingId');

function unwrap(res) {
  if (!res) return null;
  return res.data || res;
}

async function loadTicket() {
  const container = document.getElementById('ticketsWrapper');
  const actions = document.getElementById('ticketActions');

  if (!bookingId) {
    container.innerHTML = `
      <div class="state-block text-center py-5 w-100">
        <h4 class="text-danger">No Booking Specified</h4>
        <p class="text-muted-soft">Please return to your bookings page to select a valid ticket.</p>
        <a href="my-bookings.html" class="btn btn-primary btn-sm">Go to My Bookings</a>
      </div>`;
    return;
  }

  try {
    const rawBooking = await BookingsAPI.getById(bookingId);
    const booking = unwrap(rawBooking);

    if (!booking) throw new Error('Booking record not found');

    // Fetch complementary event details (date/time/venue)
    let eventDetails = null;
    try {
      if (booking.eventId) {
        const rawEvent = await EventsAPI.getById(booking.eventId);
        eventDetails = unwrap(rawEvent);
      }
    } catch (e) {
      console.warn('Could not fetch extra event details:', e);
    }

    const eventTitle = booking.eventTitle || eventDetails?.title || 'EventSphere Experience';
    const dt = eventDetails?.startDatetime ? new Date(eventDetails.startDatetime) : null;
    const dateText = dt ? dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : 'Date TBA';
    const timeText = dt ? dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : 'Time TBA';
    const venueText = eventDetails?.venueName || eventDetails?.venue?.name || 'Venue TBA';

    // Collect all individual ticket passes across booking items
    const ticketsList = [];
    (booking.items || []).forEach(item => {
      if (item.tickets && item.tickets.length > 0) {
        item.tickets.forEach(t => {
          ticketsList.push({
            ...t,
            ticketTypeName: item.ticketTypeName || 'Standard Admission'
          });
        });
      } else {
        for (let i = 0; i < (item.quantity || 1); i++) {
          ticketsList.push({
            ticketCode: `${booking.bookingReference || 'TK'}-${i + 1}`,
            attendeeName: EsAuthStore.getUser()?.fullName || 'Attendee',
            ticketTypeName: item.ticketTypeName || 'General Admission'
          });
        }
      }
    });

    const isBookingConfirmed = booking.status === 'CONFIRMED';
    const isEventPast = dt && dt < new Date();

    container.innerHTML = ticketsList.map((t, idx) => {
      const code = t.ticketCode || `${booking.bookingReference}-${idx + 1}`;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=4&data=${encodeURIComponent(code)}`;

      // Resolve effective ticket status (VALID, USED, CANCELLED, EXPIRED, PENDING)
      let statusKey = (t.status || (isBookingConfirmed ? 'VALID' : booking.status)).toUpperCase();
      if (booking.status === 'CANCELLED' || statusKey === 'CANCELLED') {
        statusKey = 'CANCELLED';
      } else if (statusKey === 'USED') {
        statusKey = 'USED';
      } else if (isEventPast) {
        statusKey = 'EXPIRED';
      } else if (isBookingConfirmed || statusKey === 'VALID') {
        statusKey = 'VALID';
      }

      // Status Badge Configuration
      let badgeHtml = '';
      let ticketCardClass = 'digital-ticket';
      let qrStubHtml = '';

      if (statusKey === 'VALID') {
        badgeHtml = `<span class="badge bg-success text-white" style="font-size:0.75rem;"><i class="bi bi-check-circle-fill me-1"></i>VALID</span>`;
        qrStubHtml = `
          <div class="qr-img-box">
            <img src="${qrUrl}" alt="Admission QR Code" loading="lazy">
          </div>
          <div class="text-muted-soft small mb-1" style="font-size:0.75rem;">Scan at Entrance</div>
          <div class="code-label fw-bold text-white" title="${code}"><code>${code}</code></div>
        `;
      } else if (statusKey === 'USED') {
        ticketCardClass += ' ticket-used';
        badgeHtml = `<span class="badge text-white" style="background:#6366f1; font-size:0.75rem;"><i class="bi bi-shield-check me-1"></i>USED / ADMITTED</span>`;
        qrStubHtml = `
          <div class="qr-img-box">
            <img src="${qrUrl}" alt="Admission QR Code" style="opacity:0.25; filter:grayscale(1);">
            <div class="qr-used-overlay">
              <i class="bi bi-check2-circle fs-1 text-success d-block mb-1"></i>
              <span class="badge bg-dark text-white fw-bold" style="font-size:0.68rem; letter-spacing:0.5px;">ADMITTED</span>
            </div>
          </div>
          <div class="text-success small fw-semibold mb-1" style="font-size:0.75rem;"><i class="bi bi-check2 me-1"></i>Ticket Checked In</div>
          <div class="code-label text-muted" title="${code}"><code>${code}</code></div>
        `;
      } else if (statusKey === 'EXPIRED') {
        ticketCardClass += ' ticket-expired';
        badgeHtml = `<span class="badge bg-secondary text-white" style="font-size:0.75rem;"><i class="bi bi-clock-history me-1"></i>EXPIRED</span>`;
        qrStubHtml = `
          <div class="qr-img-box">
            <img src="${qrUrl}" alt="Admission QR Code" style="opacity:0.2; filter:grayscale(1);">
            <div class="qr-used-overlay">
              <i class="bi bi-hourglass-bottom fs-2 text-warning d-block mb-1"></i>
              <span class="badge bg-dark text-white fw-bold" style="font-size:0.68rem;">EVENT CONCLUDED</span>
            </div>
          </div>
          <div class="text-muted-soft small mb-1" style="font-size:0.75rem;">Pass Expired</div>
          <div class="code-label text-muted" title="${code}"><code>${code}</code></div>
        `;
      } else if (statusKey === 'CANCELLED') {
        ticketCardClass += ' ticket-cancelled';
        badgeHtml = `<span class="badge bg-danger text-white" style="font-size:0.75rem;"><i class="bi bi-x-circle me-1"></i>CANCELLED</span>`;
        qrStubHtml = `
          <div class="text-danger py-4">
            <i class="bi bi-x-octagon fs-1 d-block mb-1"></i>
            <span class="fw-bold small d-block">Cancelled</span>
            <span class="text-muted" style="font-size:0.7rem;">This ticket is void</span>
          </div>
        `;
      } else {
        badgeHtml = `<span class="badge bg-warning text-dark" style="font-size:0.75rem;"><i class="bi bi-hourglass-split me-1"></i>PENDING</span>`;
        qrStubHtml = `
          <div class="text-warning py-3">
            <i class="bi bi-clock-history fs-2 d-block mb-1"></i>
            <span class="fw-bold small d-block">Pending Payment</span>
            <span class="text-muted" style="font-size:0.7rem;">QR codes activate on confirmation</span>
          </div>
        `;
      }

      return `
      <div class="${ticketCardClass}">
        <!-- Header -->
        <div class="tk-header">
          <div class="d-flex align-items-center">
            <span class="sparkle me-1">${EsIcons.sparkle}</span> EventSphere Pass
          </div>
          ${badgeHtml}
        </div>

        <!-- Horizontal Content Split -->
        <div class="tk-content-split">
          
          <!-- Left: Event & Attendee Details -->
          <div class="tk-main-info">
            <div>
              <div class="tk-event" title="${eventTitle}">${eventTitle}</div>
              
              <div class="tk-meta-grid">
                <div class="tk-meta-item">
                  <span>Date</span>
                  <b>${dateText}</b>
                </div>
                <div class="tk-meta-item">
                  <span>Time</span>
                  <b>${timeText}</b>
                </div>
                <div class="tk-meta-item">
                  <span>Venue</span>
                  <b title="${venueText}">${venueText}</b>
                </div>
                <div class="tk-meta-item">
                  <span>Ticket Type</span>
                  <b>${t.ticketTypeName}</b>
                </div>
              </div>
            </div>

            <div class="pt-3 mt-2 border-top d-flex justify-content-between align-items-center">
              <div class="tk-meta-item">
                <span>Attendee</span>
                <b class="fs-6">${t.attendeeName || 'Guest'}</b>
              </div>
              <div class="text-end">
                <span class="text-muted-soft" style="font-size:0.72rem;">REF</span>
                <div class="fw-bold text-muted" style="font-size:0.8rem;"><code>${booking.bookingReference}</code></div>
              </div>
            </div>
          </div>

          <!-- Middle: Vertical Perforation Line with Semicircle Cutouts -->
          <div class="ticket-perforation-v">
            <div class="cutout-top"></div>
            <div class="cutout-bottom"></div>
          </div>

          <!-- Right: Scannable QR Code Stub -->
          <div class="tk-qr-stub">
            ${qrStubHtml}
          </div>

        </div>
      </div>`;
    }).join('');

    actions.style.removeProperty('display');

  } catch (err) {
    console.error('Failed to load ticket:', err);
    container.innerHTML = `
      <div class="state-block text-center py-5 w-100">
        <h4 class="text-danger">Could not load tickets</h4>
        <p class="text-muted-soft">${err.message || 'Server error occurred'}</p>
        <a href="my-bookings.html" class="btn btn-quiet btn-sm">Return to Bookings</a>
      </div>`;
  }
}

loadTicket();
</script>
</body>
</html>
