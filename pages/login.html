<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — EventSphere</title>
<link rel="icon" type="image/png" href="../assets/images/logo.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="login">

<div class="auth-shell">
  <div class="auth-visual">
    <div class="hero-blob" style="width:340px; height:340px; background: radial-gradient(circle, rgba(255,46,116,0.22) 0%, transparent 70%); top:8%; left:6%;"></div>
    <div class="hero-blob" style="width:280px; height:280px; background: radial-gradient(circle, rgba(139,92,246,0.25) 0%, transparent 70%); bottom:12%; right:10%;"></div>
    <div class="auth-content">
      <a href="../index.html" class="brand mb-4 d-inline-flex align-items-center gap-2 text-decoration-none" style="color:#FFF;">
        <img src="../assets/images/logo.png" alt="EventSphere Logo" class="brand-logo me-1">
        <span class="fw-bold fs-4 text-white">EventSphere</span>
      </a>
      <h2 class="text-white fw-bold mb-3" style="max-width:380px; font-size: 2.1rem; line-height: 1.25;">Welcome back to your next favourite memory.</h2>
      <p class="text-muted-soft" style="max-width:340px; font-size: 0.92rem;">Access exclusive tickets, live bookings, and verified organizers all in one place.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <p class="eyebrow">Log in</p>
      <h2 class="mb-4 text-white">Good to see you again</h2>
      <form id="loginForm" class="d-flex flex-column gap-3" novalidate>
        <div>
          <label class="form-label text-white" for="loginEmail">Email</label>
          <input type="email" class="form-control" id="loginEmail" name="email" required placeholder="you@example.com">
          <div class="invalid-feedback"></div>
        </div>
        <div>
          <label class="form-label text-white" for="loginPassword">Password</label>
          <div class="password-toggle-group">
            <input type="password" class="form-control" id="loginPassword" name="password" required placeholder="••••••••">
            <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password"></button>
          </div>
          <div class="invalid-feedback"></div>
        </div>
        <div class="d-flex justify-content-between align-items-center" style="font-size:0.85rem;">
          <label class="d-flex align-items-center gap-2 text-muted-soft"><input type="checkbox" checked class="form-check-input mt-0"> Remember me</label>
          <a href="#" class="text-decoration-none" style="color: var(--neon-cyan);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-2">Log in</button>
      </form>
      <p class="text-center mt-4 text-muted-soft" style="font-size:0.88rem;">Don't have an account? <a href="register.html" id="registerLink" style="color: var(--neon-rose); font-weight:600;">Sign up</a></p>
    </div>
  </div>
</div>

<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/validation.js"></script>
<script>
const brandSp = document.getElementById('brandSparkle');
if (brandSp) brandSp.innerHTML = EsIcons.sparkle;
EsValidation.initPasswordToggles(document.getElementById('loginForm'));
EsValidation.attachLiveValidation(document.getElementById('loginForm'));

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  EsValidation.clearFormErrors(form);

  const emailInput = form.querySelector('[name="email"]');
  const passwordInput = form.querySelector('[name="password"]');

  let isValid = true;
  if (!EsValidation.validateEmailField(emailInput)) isValid = false;
  if (!EsValidation.validatePasswordField(passwordInput, 'Password')) isValid = false;

  if (!isValid) {
    esToast('Please fix the errors in the form.', 'error');
    return;
  }

  const email = emailInput.value;
  const password = passwordInput.value;
  const btn = form.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Logging in...'; }

  try {
    await AuthAPI.login({ email, password });
    esToast('Welcome back!');
    setTimeout(() => window.location.href = '../index.html', 500);
  } catch (err) {
    // No demo-mode fallback — a login failure is always shown for what it
    // is (wrong password, backend unreachable, etc.), never faked as success.
    esToast(err.message || 'Login failed. Check your email and password.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Log in'; }
  }
});
</script>

</body>
</html>
