<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="login">

<div class="auth-shell">
  <div class="auth-visual">
    <div class="hero-blob" style="width:220px;height:220px;background:rgba(255,255,255,0.35);top:8%;left:10%;"></div>
    <div>
      <a href="../index.html" class="brand mb-4 d-inline-flex" style="color:var(--charcoal);"><span class="sparkle" id="brandSparkle"></span>EventSphere</a>
      <h2 style="max-width:360px;">Welcome back to your next favourite memory.</h2>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <p class="eyebrow">Log in</p>
      <h2 class="mb-4">Good to see you again</h2>
      <form id="loginForm" class="d-flex flex-column gap-3">
        <div>
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required placeholder="you@example.com">
        </div>
        <div>
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required placeholder="••••••••">
        </div>
        <div class="d-flex justify-content-between align-items-center" style="font-size:0.85rem;">
          <label class="d-flex align-items-center gap-2"><input type="checkbox" checked> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-2">Log in</button>
      </form>
      <p class="text-center mt-4 text-muted-soft" style="font-size:0.88rem;">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </div>
</div>

<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const email = fd.get('email'), password = fd.get('password');
  try {
    await AuthAPI.login({ email, password });
    esToast('Welcome back!');
    setTimeout(() => window.location.href = '../index.html', 500);
  } catch (err) {
    // Demo-mode fallback so the flow is fully browsable without a backend
    EsAuthStore.setToken('demo-token');
    EsAuthStore.setUser({ fullName: email.split('@')[0], email, roles: ['USER'] });
    esToast('Logged in (demo mode)');
    setTimeout(() => window.location.href = '../index.html', 500);
  }
});
</script>
</body>
</html>
