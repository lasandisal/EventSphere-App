<!DOCTYPE html>

<head>

    <button class="navbar-toggler d-lg-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"><i class="bi bi-list fs-3"></i></button>
    <div class="collapse navbar-collapse d-lg-flex justify-content-lg-center" id="navLinks">
      <ul class="navbar-nav gap-lg-2 mt-3 mt-lg-0">
        <li class="nav-item"><a class="nav-link" data-nav="home" href="../index.html">Discover</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="events" href="events.html">Categories</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="bookings" href="my-bookings.html">My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" data-nav="about" href="../index.html#about">About</a></li>
      </ul>
    </div>
    <div class="d-flex align-items-center gap-2"><div id="navAuthSlot" class="d-flex align-items-center gap-2"></div></div>
  </div>
</nav>

<div class="ratio ratio-21x9" style="max-height:420px;">
  <img id="heroImg" src="" alt="" style="object-fit:cover;">
</div>

<section class="section-sm">
  <div class="container-narrow">
    <div class="row g-5">
      <div class="col-lg-7">
        <span class="pill-badge pill-blush mb-3" id="evCategory">Category</span>
        <h1 id="evTitle" style="font-size:2.4rem;">Loading…</h1>
        <div class="d-flex flex-wrap gap-4 mb-4 text-muted-soft" style="font-size:0.92rem;">
          <span><i class="bi bi-calendar3"></i> <span id="evDate"></span></span>
          <span><i class="bi bi-clock"></i> <span id="evTime"></span></span>
          <span><i class="bi bi-geo-alt"></i> <span id="evVenue"></span></span>
          <span><i class="bi bi-person"></i> Organized by <span id="evOrganizer">—</span></span>
        </div>
        <h3 class="mb-3">About this event</h3>
        <p id="evDescription">Loading description…</p>
      </div>

      <div class="col-lg-5">
        <div class="summary-card">
          <h3 class="mb-3">Ticket Types</h3>
          <div id="ticketTypesWrap" class="d-flex flex-column gap-3"></div>
          <button class="btn btn-primary btn-lg w-100 mt-4" id="bookBtn">Book Tickets</button>
          <p class="text-center text-muted-soft mt-2 mb-0" style="font-size:0.78rem;">Secure checkout · Instant digital ticket</p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="es-footer">
  <div class="container-narrow footer-bottom d-flex justify-content-between flex-wrap gap-2">
    <span>© 2026 EventSphere. All rights reserved.</span>
    <a href="events.html">Back to Discover</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/api/events.js"></script>
<script src="../js/api/bookings.js"></script>
<script src="../js/api/payments.js"></script>
<script src="../js/api/organizer.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<!-- <script src="../js/utils/mock-data.js"></script> -->
<script src="../js/utils/nav.js"></script>
<script src="../js/utils/ai-widget.js"></script>
<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;

const params = new URLSearchParams(window.location.search);
const eventId = params.get('id');
const selectedTickets = {}; // ticketTypeId -> {qty, price, name}

function ticketTypeCard(tt) {
  const availableQty = tt.availableQuantity ?? tt.available ?? 0;
  return `
  <div class="ticket-type-card" data-tt="${tt.id}">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <div class="tt-name">${tt.name}</div>
        <div class="tt-price">LKR ${tt.price ? tt.price.toLocaleString() : '0'}</div>
        <div class="text-muted-soft" style="font-size:0.8rem;">Available: ${availableQty}</div>
      </div>
      <div class="qty-stepper">
        <button type="button" class="qty-minus">−</button>
        <span class="qty-val">0</span>
        <button type="button" class="qty-plus">+</button>
      </div>
    </div>
  </div>`;
}

function wireTicketCards(types) {
  document.querySelectorAll('.ticket-type-card').forEach(card => {
    const id = card.getAttribute('data-tt');
    const tt = types.find(t => String(t.id) === id);
    if (!tt) return;

    const availableQty = tt.availableQuantity ?? tt.available ?? 0;
    const valEl = card.querySelector('.qty-val');

    card.querySelector('.qty-plus').addEventListener('click', () => {
      const qty = Math.min((selectedTickets[id]?.qty || 0) + 1, availableQty);
      selectedTickets[id] = { qty, price: tt.price, name: tt.name };
      valEl.textContent = qty;
      card.classList.toggle('selected', qty > 0);
    });

    card.querySelector('.qty-minus').addEventListener('click', () => {
      const qty = Math.max((selectedTickets[id]?.qty || 0) - 1, 0);
      selectedTickets[id] = { qty, price: tt.price, name: tt.name };
      valEl.textContent = qty;
      card.classList.toggle('selected', qty > 0);
    });
  });
}

document.getElementById('bookBtn').addEventListener('click', () => {
  const items = Object.entries(selectedTickets).filter(([, v]) => v.qty > 0);
  if (!items.length) { esToast('Select at least one ticket to continue', 'error'); return; }
  const payload = { eventId, items: items.map(([id, v]) => ({ ticketTypeId: id, quantity: v.qty, price: v.price, name: v.name })) };
  sessionStorage.setItem('es_pending_booking', JSON.stringify(payload));
  const returnTo = 'booking.html?eventId=' + eventId;
  if (!EsAuthStore.isLoggedIn()) {
    esToast('Please log in to book tickets', 'error');
    setTimeout(() => window.location.href = 'login.html?redirect=' + encodeURIComponent(returnTo), 900);
    return;
  }
  window.location.href = returnTo;
});

async function loadEvent() {
  if (!eventId) {
    window.location.href = 'events.html';
    return;
  }

  try {
    const ev = await EventsAPI.getById(eventId);
    if (!ev) throw new Error('Event not found');

    // Format start datetime into Date and Time strings
    let dateText = 'TBA';
    let timeText = 'TBA';
    if (ev.startDatetime) {
      const d = new Date(ev.startDatetime);
      dateText = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      timeText = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    document.getElementById('heroImg').src = ev.bannerUrl || ev.imageUrl || 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=1200&q=80';
    document.getElementById('evCategory').textContent = ev.categoryName || 'Event';
    document.getElementById('evTitle').textContent = ev.title || 'Untitled Event';
    document.getElementById('evDate').textContent = dateText;
    document.getElementById('evTime').textContent = timeText;
    document.getElementById('evVenue').textContent = ev.venueName || 'TBA';
    document.getElementById('evOrganizer').textContent = ev.organizerName || 'Organizer';
    document.getElementById('evDescription').textContent = ev.description || 'No description provided.';

    const ticketTypes = ev.ticketTypes || [];
    const wrap = document.getElementById('ticketTypesWrap');
    
    if (ticketTypes.length) {
      wrap.innerHTML = ticketTypes.map(ticketTypeCard).join('');
      wireTicketCards(ticketTypes);
    } else {
      wrap.innerHTML = '<p class="text-muted-soft">No tickets currently available for this event.</p>';
    }

  } catch (e) {
    console.error('Error loading event:', e);
    esToast('Could not load event details', 'error');
    document.getElementById('evTitle').textContent = 'Event Not Found';
    document.getElementById('evDescription').textContent = 'The event you requested could not be retrieved from the server.';
  }
}

loadEvent();
</script>
</body>
</html>
