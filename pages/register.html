<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="register">

<div class="auth-shell">
  <div class="auth-visual" style="background: linear-gradient(160deg, var(--sage-soft) 0%, var(--blush) 100%);">
    <div class="hero-blob" style="width:200px;height:200px;background:rgba(255,255,255,0.4);bottom:12%;right:10%;"></div>
    <div>
      <a href="/index.html" class="brand mb-4 d-inline-flex" style="color:var(--charcoal);"><span class="sparkle" id="brandSparkle"></span>EventSphere</a>
      <h2 style="max-width:360px;">Join a calmer way to discover events worth showing up for.</h2>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <p class="eyebrow">Create account</p>
      <h2 class="mb-4">Let's get you set up</h2>
      <form id="registerForm" class="d-flex flex-column gap-3">
        <div>
          <label class="form-label">Full name</label>
          <input type="text" class="form-control" name="fullName" required placeholder="Your name">
        </div>
        <div>
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required placeholder="you@example.com">
        </div>
        <div>
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required placeholder="••••••••">
        </div>
        <div>
          <label class="form-label">Confirm password</label>
          <input type="password" class="form-control" name="confirmPassword" required placeholder="••••••••">
        </div>
        <div>
          <label class="form-label">Account type</label>
          <select class="form-select" name="accountType">
            <option value="USER">Attendee — browse &amp; book events</option>
            <option value="ORGANIZER">Organizer — host events (pending review)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-2">Create account</button>
      </form>
      <p class="text-center mt-4 text-muted-soft" style="font-size:0.88rem;">Already have an account? <a href="/pages/login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script>
document.getElementById('brandSparkle').innerHTML = EsIcons.sparkle;

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = Object.fromEntries(fd.entries());
  if (payload.password !== payload.confirmPassword) { esToast('Passwords do not match', 'error'); return; }
  try {
    await AuthAPI.register(payload);
    esToast('Account created — welcome to EventSphere!');
    setTimeout(() => window.location.href = '/index.html', 600);
  } catch (err) {
    EsAuthStore.setToken('demo-token');
    EsAuthStore.setUser({ fullName: payload.fullName, email: payload.email, roles: [payload.accountType === 'ORGANIZER' ? 'ORGANIZER' : 'USER'] });
    esToast('Account created (demo mode)');
    setTimeout(() => window.location.href = '/index.html', 600);
  }
});
</script>
</body>
</html>
