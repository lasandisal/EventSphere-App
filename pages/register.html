<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — EventSphere</title>
<link rel="icon" type="image/png" href="../assets/images/logo.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="register">

<div class="auth-shell">
  <div class="auth-visual">
    <div class="hero-blob" style="width:340px; height:340px; background: radial-gradient(circle, rgba(139,92,246,0.22) 0%, transparent 70%); top:8%; left:6%;"></div>
    <div class="hero-blob" style="width:280px; height:280px; background: radial-gradient(circle, rgba(255,46,116,0.22) 0%, transparent 70%); bottom:12%; right:10%;"></div>
    <div class="auth-content">
      <a href="../index.html" class="brand mb-4 d-inline-flex align-items-center gap-2 text-decoration-none" style="color:#FFF;">
        <img src="../assets/images/logo.png" alt="EventSphere Logo" class="brand-logo me-1">
        <span class="fw-bold fs-4 text-white">EventSphere</span>
      </a>
      <h2 class="text-white fw-bold mb-3" style="max-width:380px; font-size: 2.1rem; line-height: 1.25;">Join a calmer way to discover events worth showing up for.</h2>
      <p class="text-muted-soft" style="max-width:340px; font-size: 0.92rem;">Instant QR digital admission, secure checkout, and verified organizer experiences.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <p class="eyebrow">Create account</p>
      <h2 class="mb-4 text-white">Let's get you set up</h2>
      <form id="registerForm" class="d-flex flex-column gap-3" novalidate>
        <div>
          <label class="form-label text-white" for="regFullName">Full name</label>
          <input type="text" class="form-control" id="regFullName" name="fullName" required placeholder="Your name">
          <div class="invalid-feedback"></div>
        </div>
        <div>
          <label class="form-label text-white" for="regEmail">Email</label>
          <input type="email" class="form-control" id="regEmail" name="email" required placeholder="you@example.com">
          <div class="invalid-feedback"></div>
        </div>
        <div>
          <label class="form-label text-white" for="regPassword">Password</label>
          <div class="password-toggle-group">
            <input type="password" class="form-control" id="regPassword" name="password" required placeholder="••••••••">
            <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password"></button>
          </div>
          <div class="invalid-feedback"></div>
        </div>
        <div>
          <label class="form-label text-white" for="regConfirmPassword">Confirm password</label>
          <div class="password-toggle-group">
            <input type="password" class="form-control" id="regConfirmPassword" name="confirmPassword" required placeholder="••••••••">
            <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password"></button>
          </div>
          <div class="invalid-feedback"></div>
        </div>
        <div>
          <label class="form-label text-white">Account type</label>
          <select class="form-select" name="accountType">
            <option value="USER">Attendee — browse &amp; book events</option>
            <option value="ORGANIZER">Organizer — host events (pending review)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-2">Create account</button>
      </form>
      <p class="text-center mt-4 text-muted-soft" style="font-size:0.88rem;">Already have an account? <a href="login.html" id="loginLink" style="color: var(--neon-rose); font-weight:600;">Log in</a></p>
    </div>
  </div>
</div>

<script src="../js/env.js"></script>
<script src="../js/api/config.js"></script>
<script src="../js/api/auth.js"></script>
<script src="../js/utils/icons.js"></script>
<script src="../js/utils/toast.js"></script>
<script src="../js/utils/validation.js"></script>
<script>
const brandSp = document.getElementById('brandSparkle');
if (brandSp) brandSp.innerHTML = EsIcons.sparkle;
EsValidation.initPasswordToggles(document.getElementById('registerForm'));
EsValidation.attachLiveValidation(document.getElementById('registerForm'));

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  EsValidation.clearFormErrors(form);

  const fullNameInput = form.querySelector('[name="fullName"]');
  const emailInput = form.querySelector('[name="email"]');
  const passwordInput = form.querySelector('[name="password"]');
  const confirmPasswordInput = form.querySelector('[name="confirmPassword"]');

  let isValid = true;
  if (!EsValidation.validateRequiredField(fullNameInput, 'Full name')) isValid = false;
  if (!EsValidation.validateEmailField(emailInput)) isValid = false;
  if (!EsValidation.validatePasswordField(passwordInput, 'Password')) isValid = false;
  if (!EsValidation.validatePasswordConfirmation(passwordInput, confirmPasswordInput)) isValid = false;

  if (!isValid) {
    esToast('Please fix the errors in the form.', 'error');
    return;
  }

  const fd = new FormData(form);
  const payload = Object.fromEntries(fd.entries());

  // The backend has no accountType field — self-registration always grants
  // USER only (RoleName.USER), never ORGANIZER. Organizer access is a
  // separate application + admin-approval flow (organizer-apply.html), by
  // design, so nobody can start publishing events unchecked. If this form
  // still has an "account type" selector implying otherwise, that's worth
  // removing or repointing at the apply flow — it's misleading as-is.
  delete payload.accountType;
  delete payload.confirmPassword;

  const btn = form.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating account...'; }

  try {
    await AuthAPI.register(payload);
    esToast('Account created — welcome to EventSphere!');
    setTimeout(() => window.location.href = '../index.html', 600);
  } catch (err) {
    esToast(err.message || 'Could not create your account.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Sign up'; }
  }
});
</script>

</body>
</html>
